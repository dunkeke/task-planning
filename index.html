<!DOCTYPE html>
<html>
<head>
    <title>工作计划浮窗</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- 主浮窗 -->
    <div id="floating-window" class="floating-window">
        <div class="header drag-handle">
            <h3>今日计划 <span id="current-date"></span></h3>
            <span class="header-badge" aria-hidden="true">✨ 今日加油</span>
            <div class="controls">
                <button id="minimize"><i class="fas fa-minus"></i></button>
                <button id="close"><i class="fas fa-times"></i></button>
            </div>
        </div>
        
        <div class="content">
    <!-- 任务输入区域 -->
    <div class="task-input">
        <input type="text" id="new-task" placeholder="添加新任务...">
        <button id="add-task"><i class="fas fa-plus"></i></button>
    </div>
    <div class="urgent-options">
        <label>
            <input type="checkbox" id="urgent-flag">
            紧急任务提醒
        </label>
        <input type="time" id="urgent-time" aria-label="紧急任务提醒时间">
    </div>

    <div class="task-hint">
        <i class="fas fa-grip-lines"></i> 拖拽任务可调整优先级顺序
    </div>
    
    <!-- 任务列表 -->
    <ul id="task-list">
        <!-- 任务项会动态添加到这里 -->
    </ul>

    <!-- 日度工作量记录 -->
    <div class="workload-section">
        <h4>日度工作量</h4>
        <div class="workload-inputs">
            <input type="date" id="workload-date">
            <input type="number" id="workload-hours" min="0" step="0.5" placeholder="工时">
            <input type="text" id="workload-notes" placeholder="工作内容要点">
            <button id="add-workload"><i class="fas fa-clipboard-check"></i></button>
        </div>
        <ul id="workload-list"></ul>
    </div>

    <!-- 进度统计 -->
    <div class="stats">
        完成: <span id="completed-count">0</span>/<span id="total-count">0</span>
    </div>
</div>
 
    
    <!-- 最小化时显示的按钮 -->
    <button id="restore-btn" class="restore-btn">
        <i class="fas fa-tasks"></i>
    </button>
    
    <script src="script.js"></script>
</body>

</html>
